services:

  backend:
    build:
      context: ./backend

    container_name: backend

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env

    depends_on:
      - mongodb
      - redis

    command: npm run dev

  mongodb:
    image: mongo

    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express

    restart: unless-stopped

    depends_on:
      - mongodb

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017

      # Disable login screen for local development
      ME_CONFIG_BASICAUTH: "false"    

  redis:
    image: redis:8-alpine

    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight

    restart: unless-stopped

    depends_on:
      - redis

    ports:
      - "5540:5540"

    volumes:
      - redis-insight-data:/data

volumes:
  mongo-data:
  redis-data:
  redis-insight-data: