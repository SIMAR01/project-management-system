services:

  frontend:
    build:
      context: ./frontend

    container_name: frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/app/.env

    depends_on:
      - backend

    command: npm run dev

  backend:
    build:
      context: ./backend

    container_name: backend

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env

    depends_on:
      - mongodb
      - redis

    command: npm run dev

  mongodb:
    image: mongo

    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8-alpine

    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data: